name: Build & Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Tag Version (e.g. v0.0.1)'
        required: true
        default: 'v1.6.2'

permissions:
  contents: read
  actions: read

env:
  RUST_TOOLCHAIN: stable
  NODE_VERSION: "20.17.0"
  BUN_VERSION: "1.4.0"

jobs:
  quality:
    name: Release quality gates
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Install Rust
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          components: rustfmt, clippy

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev libpkgconf-dev

      - name: Install dependencies
        run: bun ci

      - name: Rust format check
        run: cargo fmt --all -- --check

      - name: Rust linting
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Rust tests
        run: cargo test --all-targets

      - name: TypeScript type check
        run: bun run tsc --noEmit

  build-release:
    name: Build - ${{ matrix.target }}
    needs: quality
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          # --- Windows ---
          - os: windows-2022
            target: x86_64-pc-windows-msvc
            artifact: miniaudio_node.win32-x64-msvc.node
            run_tests: true

          - os: windows-2022
            target: i686-pc-windows-msvc
            artifact: miniaudio_node.win32-ia32-msvc.node
            run_tests: false

          # --- macOS ---
          # 1. Intel (x64)
          - os: macos-15-intel
            target: x86_64-apple-darwin
            artifact: miniaudio_node.darwin-x64.node
            macos_deployment_target: "10.15"
            run_tests: true

          # 2. Apple Silicon (ARM64)
          - os: macos-15
            target: aarch64-apple-darwin
            artifact: miniaudio_node.darwin-arm64.node
            # arm64 macOS binaries require macOS 11 or newer.
            macos_deployment_target: "11.0"
            run_tests: true

          # --- Linux ---
          # 1. x64 Linux
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            artifact: miniaudio_node.linux-x64-gnu.node
            run_tests: true

          # 2. ARM64 Linux
          - os: ubuntu-24.04
            target: aarch64-unknown-linux-gnu
            artifact: miniaudio_node.linux-arm64-gnu.node
            run_tests: false

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Install Rust
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          targets: ${{ matrix.target }}

      - name: Configure macOS build
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail
          echo "MACOSX_DEPLOYMENT_TARGET=${{ matrix.macos_deployment_target }}" >> "$GITHUB_ENV"
          echo "Building ${{ matrix.target }} for macOS ${{ matrix.macos_deployment_target }}+"

      # --- Linux Dependencies (x64) ---
      - name: Install system dependencies (Linux x64)
        if: matrix.target == 'x86_64-unknown-linux-gnu'
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev libpkgconf-dev

      # --- Linux Dependencies (ARM64 Cross-compilation) ---
      - name: Install system dependencies (Linux ARM64)
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        run: |
          sudo dpkg --add-architecture arm64
          sudo rm -f /etc/apt/sources.list.d/ubuntu.sources
          sudo rm -f /etc/apt/sources.list.d/*.list

          cat <<EOF | sudo tee /etc/apt/sources.list
          deb [arch=amd64] http://archive.ubuntu.com/ubuntu noble main restricted universe multiverse
          deb [arch=amd64] http://archive.ubuntu.com/ubuntu noble-updates main restricted universe multiverse
          deb [arch=amd64] http://archive.ubuntu.com/ubuntu noble-backports main restricted universe multiverse
          deb [arch=amd64] http://security.ubuntu.com/ubuntu noble-security main restricted universe multiverse
          deb [arch=arm64] http://ports.ubuntu.com/ubuntu-ports noble main restricted universe multiverse
          deb [arch=arm64] http://ports.ubuntu.com/ubuntu-ports noble-updates main restricted universe multiverse
          deb [arch=arm64] http://ports.ubuntu.com/ubuntu-ports noble-backports main restricted universe multiverse
          deb [arch=arm64] http://ports.ubuntu.com/ubuntu-ports noble-security main restricted universe multiverse
          EOF

          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu g++-aarch64-linux-gnu libasound2-dev:arm64

          echo "PKG_CONFIG_ALLOW_CROSS=1" >> $GITHUB_ENV
          echo "PKG_CONFIG_PATH=/usr/lib/aarch64-linux-gnu/pkgconfig" >> $GITHUB_ENV
          echo "CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER=aarch64-linux-gnu-gcc" >> $GITHUB_ENV
          echo "CC_aarch64_unknown_linux_gnu=aarch64-linux-gnu-gcc" >> $GITHUB_ENV
          echo "CXX_aarch64_unknown_linux_gnu=aarch64-linux-gnu-g++" >> $GITHUB_ENV

      - name: Configure Git (Windows)
        if: runner.os == 'Windows'
        run: |
          git config --global core.autocrlf input
          git config --global core.eol lf

      - name: Install dependencies
        run: bun ci

      - name: Build native module
        shell: bash
        run: |
          set -euo pipefail
          echo "Building for target: ${{ matrix.target }}"
          bunx napi build --platform --release --target ${{ matrix.target }}

      - name: Normalize native module artifact
        shell: bash
        run: |
          set -euo pipefail
          native_file=$(find . -maxdepth 1 -type f -name '*.node' -print -quit)
          if [[ -z "$native_file" ]]; then
            echo "No native .node file was produced for ${{ matrix.target }}"
            exit 1
          fi
          if [[ "$native_file" != "./${{ matrix.artifact }}" ]]; then
            mv "$native_file" "${{ matrix.artifact }}"
          fi
          test -s "${{ matrix.artifact }}"

      - name: Run release tests
        if: matrix.run_tests
        shell: bash
        run: |
          if [ ! -f "${{ matrix.artifact }}" ]; then
            echo "Error: artifact ${{ matrix.artifact }} not found after build"
            exit 1
          fi
          export NAPI_RS_NATIVE_LIBRARY_PATH="$(pwd)/${{ matrix.artifact }}"
          bun test

      - name: Prepare artifact
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist/
          cp "${{ matrix.artifact }}" "dist/${{ matrix.artifact }}"

      - name: Upload artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ matrix.artifact }}
          path: dist/${{ matrix.artifact }}
          if-no-files-found: error
          retention-days: 1

  # JOB 2: PUBLISH (Github Release + NPM)
  release:
    name: Publish Release
    needs: build-release
    permissions:
      actions: read
      contents: write
      packages: write
      id-token: write
    runs-on: ubuntu-24.04
    if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Determine Tag
        id: tag_info
        shell: bash
        env:
          DISPATCH_VERSION: ${{ inputs.version }}
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG_NAME="$DISPATCH_VERSION"
          else
            TAG_NAME="$GITHUB_REF_NAME"
          fi
          if [[ ! "$TAG_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]; then
            echo "Invalid release tag: $TAG_NAME"
            exit 1
          fi
          echo "TAG_NAME=$TAG_NAME" >> "$GITHUB_ENV"
          echo "tag_name=$TAG_NAME" >> "$GITHUB_OUTPUT"

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          registry-url: "https://registry.npmjs.org"

      - name: Download all artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: artifacts

      - name: Prepare Package
        run: |
          mkdir -p package

          for file in package.json index.js index.d.ts README.md LICENSE; do
            if [[ ! -f "$file" ]]; then
              echo "Required package file is missing: $file"
              exit 1
            fi
            cp "$file" package/
          done

          echo "Flattening artifacts..."
          find artifacts -name "*.node" -exec cp {} package/ \;

          expected_artifacts=(
            miniaudio_node.win32-x64-msvc.node
            miniaudio_node.win32-ia32-msvc.node
            miniaudio_node.darwin-x64.node
            miniaudio_node.darwin-arm64.node
            miniaudio_node.linux-x64-gnu.node
            miniaudio_node.linux-arm64-gnu.node
          )
          for artifact in "${expected_artifacts[@]}"; do
            if [[ ! -s "package/$artifact" ]]; then
              echo "Required native artifact is missing: $artifact"
              exit 1
            fi
          done

          ls -l package/

          VERSION="${TAG_NAME#v}"
          echo "Setting version to $VERSION"
          export PACKAGE_VERSION="$VERSION"
          node <<'NODE'
          const fs = require('fs')
          const packagePath = 'package/package.json'
          const packageJson = JSON.parse(fs.readFileSync(packagePath, 'utf8'))
          packageJson.version = process.env.PACKAGE_VERSION
          fs.writeFileSync(packagePath, `${JSON.stringify(packageJson, null, 2)}\n`)
          NODE

      - name: Create GitHub Release
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          files: package/*.node
          tag_name: ${{ env.TAG_NAME }}
          name: Release ${{ env.TAG_NAME }}
          draft: false
          prerelease: false
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish to NPM
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [ -z "$NODE_AUTH_TOKEN" ]; then
            echo "::warning::NPM_TOKEN secret is not set; skipping npm publish."
            exit 0
          fi
          cd package
          npm publish --access public
