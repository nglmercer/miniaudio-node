name: Lint & Code Quality

on:
  push:
    branches: [main, develop]
    paths-ignore:
      - "**.md"
      - "docs/**"
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

concurrency:
  group: lint-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  RUST_TOOLCHAIN: stable
  NODE_VERSION: "20.17.0"
  BUN_VERSION: "1.4.0"

jobs:
  lint:
    name: Lint & Quality Checks
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev libpkgconf-dev

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Install Rust
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          components: rustfmt, clippy

      - name: Cache Rust dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target/
          key: ubuntu-24.04-cargo-lint-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            ubuntu-24.04-cargo-lint-

      - name: Cache Bun dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            node_modules
            .bun-cache
            ~/.npm
          key: ubuntu-24.04-bun-${{ hashFiles('package.json', 'bun.lock') }}
          restore-keys: |
            ubuntu-24.04-bun-

      - name: Install dependencies
        run: bun ci

      - name: Rust format check
        run: cargo fmt --all -- --check

      - name: Rust linting (clippy)
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: TypeScript type check
        run: bun run tsc --noEmit
