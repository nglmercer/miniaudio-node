name: Build & Test CI

on:
  push:
    branches: [main, develop]
    paths-ignore:
      - "**.md"
      - "docs/**"
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  RUST_TOOLCHAIN: stable
  NODE_VERSION: "20.17.0"
  BUN_VERSION: "1.4.0"

jobs:
  build-test:
    name: Build & Test - ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          # --- Windows ---
          - os: windows-2022
            target: x86_64-pc-windows-msvc
            artifact: miniaudio_node.win32-x64-msvc.node
            run_tests: true

          - os: windows-2022
            target: i686-pc-windows-msvc
            artifact: miniaudio_node.win32-ia32-msvc.node
            run_tests: false

          # --- macOS ---
          # 1. Intel (x64) Build
          - os: macos-15-intel
            target: x86_64-apple-darwin
            artifact: miniaudio_node.darwin-x64.node
            macos_deployment_target: "10.15"
            run_tests: true

          # 2. Apple Silicon (ARM64) Build
          - os: macos-15
            target: aarch64-apple-darwin
            artifact: miniaudio_node.darwin-arm64.node
            # arm64 macOS binaries require macOS 11 or newer.
            macos_deployment_target: "11.0"
            run_tests: true

          # --- Linux ---
          # 1. x64 Linux
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            artifact: miniaudio_node.linux-x64-gnu.node
            run_tests: true

          # 2. ARM64 Linux (IMPLEMENTED)
          # We cannot run tests here because the runner is x64, and the binary is ARM64.
          - os: ubuntu-24.04
            target: aarch64-unknown-linux-gnu
            artifact: miniaudio_node.linux-arm64-gnu.node
            run_tests: false

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Install Rust
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          targets: ${{ matrix.target }}

      - name: Configure macOS build
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail
          echo "MACOSX_DEPLOYMENT_TARGET=${{ matrix.macos_deployment_target }}" >> "$GITHUB_ENV"
          echo "Building ${{ matrix.target }} for macOS ${{ matrix.macos_deployment_target }}+"

      # --- Linux Dependencies (x64) ---
      - name: Install system dependencies (Linux x64)
        if: matrix.target == 'x86_64-unknown-linux-gnu'
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev libpkgconf-dev

      # --- Linux Dependencies (ARM64 Cross-compilation) ---
      - name: Install system dependencies (Linux ARM64)
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        run: |
          # 1. Enable ARM64 architecture
          sudo dpkg --add-architecture arm64

          # 2. Handle Ubuntu 24.04 (Noble) sources configuration
          # Ubuntu 24.04 uses /etc/apt/sources.list.d/ubuntu.sources (Deb822 format).
          # We remove it and replace it with a classic, explicit sources.list to avoid
          # "404 Not Found" errors when apt tries to find arm64 packages on amd64 mirrors.
          sudo rm -f /etc/apt/sources.list.d/ubuntu.sources
          sudo rm -f /etc/apt/sources.list.d/*.list

          # 3. Create a fresh sources.list with explicit architecture definitions
          # - amd64 -> archive.ubuntu.com (Standard)
          # - arm64 -> ports.ubuntu.com (Ports)
          cat <<EOF | sudo tee /etc/apt/sources.list
          deb [arch=amd64] http://archive.ubuntu.com/ubuntu noble main restricted universe multiverse
          deb [arch=amd64] http://archive.ubuntu.com/ubuntu noble-updates main restricted universe multiverse
          deb [arch=amd64] http://archive.ubuntu.com/ubuntu noble-backports main restricted universe multiverse
          deb [arch=amd64] http://security.ubuntu.com/ubuntu noble-security main restricted universe multiverse
          deb [arch=arm64] http://ports.ubuntu.com/ubuntu-ports noble main restricted universe multiverse
          deb [arch=arm64] http://ports.ubuntu.com/ubuntu-ports noble-updates main restricted universe multiverse
          deb [arch=arm64] http://ports.ubuntu.com/ubuntu-ports noble-backports main restricted universe multiverse
          deb [arch=arm64] http://ports.ubuntu.com/ubuntu-ports noble-security main restricted universe multiverse
          EOF

          # 4. Update and install the required ARM64 dependencies
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu g++-aarch64-linux-gnu libasound2-dev:arm64

          # 5. Configure Environment for Cross-Compilation
          echo "PKG_CONFIG_ALLOW_CROSS=1" >> $GITHUB_ENV
          echo "PKG_CONFIG_PATH=/usr/lib/aarch64-linux-gnu/pkgconfig" >> $GITHUB_ENV
          echo "CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER=aarch64-linux-gnu-gcc" >> $GITHUB_ENV
          echo "CC_aarch64_unknown_linux_gnu=aarch64-linux-gnu-gcc" >> $GITHUB_ENV
          echo "CXX_aarch64_unknown_linux_gnu=aarch64-linux-gnu-g++" >> $GITHUB_ENV

      - name: Configure Git (Windows)
        if: runner.os == 'Windows'
        run: |
          git config --global core.autocrlf input
          git config --global core.eol lf

      - name: Cache Rust dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target/
          key: ${{ matrix.os }}-${{ matrix.target }}-cargo-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            ${{ matrix.os }}-${{ matrix.target }}-cargo-

      - name: Install dependencies
        run: bun ci

      - name: Build native module
        shell: bash
        run: |
          set -euo pipefail
          echo "Building for target: ${{ matrix.target }}"
          bunx napi build --platform --release --target ${{ matrix.target }}

      - name: Normalize native module artifact
        shell: bash
        run: |
          set -euo pipefail
          native_file=$(find . -maxdepth 1 -type f -name '*.node' -print -quit)
          if [[ -z "$native_file" ]]; then
            echo "No native .node file was produced for ${{ matrix.target }}"
            exit 1
          fi
          if [[ "$native_file" != "./${{ matrix.artifact }}" ]]; then
            mv "$native_file" "${{ matrix.artifact }}"
          fi
          test -s "${{ matrix.artifact }}"

      - name: Run Node.js smoke test
        if: matrix.run_tests
        shell: bash
        run: |
          echo "test artifact: ${{ matrix.artifact }}"

          if [ ! -f "${{ matrix.artifact }}" ]; then
             echo "❌ Error: Artifact ${{ matrix.artifact }} not found!"
             exit 1
          fi

          export NAPI_RS_NATIVE_LIBRARY_PATH="$(pwd)/${{ matrix.artifact }}"
          echo "Linking native library from: $NAPI_RS_NATIVE_LIBRARY_PATH"

          node -e "const m = require('./index.js'); if (!m.AudioPlayer || !Array.isArray(m.getSupportedFormats())) process.exit(1); const p = new m.AudioPlayer(); if (p.getState() !== m.PlaybackState.Stopped) process.exit(1); console.log('Node.js native module smoke test passed')"

      - name: Run deterministic tests
        if: matrix.run_tests
        shell: bash
        run: |
          set -euo pipefail
          export NAPI_RS_NATIVE_LIBRARY_PATH="$(pwd)/${{ matrix.artifact }}"
          bun test tests/unit/deterministic.test.ts --reporter=junit --reporter-outfile=deterministic-junit.xml
          node scripts/assert-junit-tests.js deterministic-junit.xml 1

      - name: Run hardware-dependent tests
        if: matrix.run_tests
        shell: bash
        run: |
          set -euo pipefail
          export NAPI_RS_NATIVE_LIBRARY_PATH="$(pwd)/${{ matrix.artifact }}"
          bun run test:hardware

      - name: Prepare artifact for upload
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist/
          cp "${{ matrix.artifact }}" "dist/${{ matrix.artifact }}"

      - name: Upload artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ matrix.artifact }}
          path: dist/${{ matrix.artifact }}
          if-no-files-found: error
          retention-days: 7
